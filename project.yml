name: WisdomSnap
options:
  bundleIdPrefix: com.alrebo92
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  WisdomSnap:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alrebo92.WisdomSnap
        INFOPLIST_FILE: WisdomSnap/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: WisdomSnap/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "スクショを分析して格言・習慣を抽出するために使用します"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - target: WisdomSnapWidget
        embed: true
    scheme:
      testTargets:
        - WisdomSnapTests

  WisdomSnapWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WisdomSnapWidget
      - path: Services/LocalSuggestionDatabase.swift
      - path: Models/SuggestionType.swift
      - path: Models/WidgetSuggestion.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alrebo92.WisdomSnap.widget
        INFOPLIST_FILE: WisdomSnapWidget/Info.plist
    info:
      path: WisdomSnapWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  WisdomSnapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WisdomSnapTests
    dependencies:
      - target: WisdomSnap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alrebo92.WisdomSnapTests

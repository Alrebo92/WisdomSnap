<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 背景グラデーション -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.80"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- カード（後ろ） -->
  <rect x="280" y="480" width="440" height="300" rx="28"
        fill="white" fill-opacity="0.25" transform="rotate(-8 512 512)"/>

  <!-- カード（前） -->
  <rect x="260" y="340" width="500" height="340" rx="28" fill="url(#card)"
        transform="rotate(4 512 512)"/>

  <!-- テキストライン（格言を表現） -->
  <rect x="320" y="420" width="360" height="14" rx="7"
        fill="#6C63FF" fill-opacity="0.8" transform="rotate(4 512 512)"/>
  <rect x="320" y="452" width="280" height="14" rx="7"
        fill="#6C63FF" fill-opacity="0.5" transform="rotate(4 512 512)"/>
  <rect x="320" y="484" width="320" height="14" rx="7"
        fill="#6C63FF" fill-opacity="0.3" transform="rotate(4 512 512)"/>

  <!-- スパークル（上） -->
  <g transform="translate(650, 220)" fill="white">
    <path d="M20 0 L24 14 L38 18 L24 22 L20 36 L16 22 L2 18 L16 14 Z"/>
  </g>
  <g transform="translate(360, 160)" fill="white" opacity="0.7">
    <path d="M12 0 L14 8 L22 10 L14 12 L12 20 L10 12 L2 10 L10 8 Z"/>
  </g>
  <g transform="translate(690, 330)" fill="white" opacity="0.5">
    <path d="M8 0 L10 6 L16 8 L10 10 L8 16 L6 10 L0 8 L6 6 Z"/>
  </g>
</svg>
